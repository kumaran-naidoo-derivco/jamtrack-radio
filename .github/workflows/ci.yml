name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Phase 1: Repository structure validation
      # Expanded in Phase 2 to include dotnet build and test steps
      # ---------------------------------------------------------------

      - name: Verify required documentation files
        run: |
          echo "Checking required files exist..."
          test -f README.md         && echo "✓ README.md"
          test -f CONTRIBUTING.md   && echo "✓ CONTRIBUTING.md"
          test -f ARCHITECTURE.md   && echo "✓ ARCHITECTURE.md"
          test -f CLAUDE.md         && echo "✓ CLAUDE.md"
          echo "Documentation check passed."

      - name: Validate GitHub Actions workflow YAML
        run: |
          echo "Checking workflow files are valid YAML..."
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" \
              && echo "✓ $f" \
              || (echo "✗ $f is invalid" && exit 1)
          done
          echo "Workflow YAML validation passed."

      # ---------------------------------------------------------------
      # Phase 2+: dotnet build and test — runs automatically when a
      # .sln file is detected in the repository root.
      # ---------------------------------------------------------------

      - name: Detect .NET solution
        id: detect-dotnet
        run: |
          if ls *.sln 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✓ .NET solution detected"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .sln file found — skipping dotnet steps"
          fi

      - name: Setup .NET
        if: steps.detect-dotnet.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        if: steps.detect-dotnet.outputs.found == 'true'
        run: dotnet restore

      - name: Build
        if: steps.detect-dotnet.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.detect-dotnet.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release
