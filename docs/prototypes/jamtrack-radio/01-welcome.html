<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamtrack Radio — Welcome</title>
  <style>
    :root {
      --color-bg:#071b1b; --color-surface:#0f2626; --color-surface-raised:#163333;
      --color-border:#1e4040; --color-accent:#00e5c8; --color-accent-hover:#33eedb;
      --color-accent-subtle:#0a2d2a; --color-accent-2:#ff2d9b; --color-accent-2-hover:#ff5cb4;
      --color-text-primary:#e8f8f8; --color-text-secondary:#7ec8c8; --color-text-muted:#3d7070;
      --shadow-glow-cyan:0 0 20px rgba(0,229,200,0.3); --shadow-glow-rose:0 0 20px rgba(255,45,155,0.3);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--color-bg); color: var(--color-text-primary);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      position: relative; overflow: hidden;
    }

    /* ── Psychedelic background ── */
    .bg-staff {
      position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        180deg, transparent 0px, transparent 28px,
        rgba(0,229,200,0.05) 28px, rgba(0,229,200,0.05) 29px
      );
    }
    .bg-notes {
      position: fixed; inset: 0; pointer-events: none;
      font-size: 7rem; color: rgba(0,229,200,0.04);
      display: flex; flex-wrap: wrap; gap: 60px;
      padding: 40px; align-content: flex-start; user-select: none;
    }
    .bg-notes span:nth-child(even) {
      color: rgba(255,45,155,0.04); transform: rotate(-12deg);
    }
    .bg-notes span:nth-child(3n) { transform: rotate(20deg); }
    .bg-clef {
      position: fixed; right: 5%; top: 50%; transform: translateY(-50%);
      font-size: 28rem; color: rgba(0,229,200,0.03); pointer-events: none;
      user-select: none; line-height: 1;
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 1;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 20px; padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      text-align: center;
    }
    .logo { font-size: 3rem; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(0,229,200,0.5)); }
    .brand { font-size: 1.6rem; font-weight: 800; color: var(--color-accent);
      text-shadow: 0 0 24px rgba(0,229,200,0.4); margin-bottom: 8px; }
    .tagline { font-size: 0.9rem; color: var(--color-text-secondary); margin-bottom: 40px; line-height: 1.5; }

    .btn {
      display: block; width: 100%; padding: 14px 24px;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; border: none; text-decoration: none; text-align: center;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-primary {
      background: var(--color-accent); color: #071b1b; margin-bottom: 12px;
    }
    .btn-primary:hover { background: var(--color-accent-hover); box-shadow: var(--shadow-glow-cyan); }
    .btn-secondary {
      background: transparent; color: var(--color-accent);
      border: 1px solid var(--color-accent);
    }
    .btn-secondary:hover { background: var(--color-accent-subtle); box-shadow: var(--shadow-glow-cyan); }

    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--color-text-muted); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }

    .feature-list { display: flex; justify-content: center; gap: 24px; margin-top: 32px; flex-wrap: wrap; }
    .feature { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--color-text-muted); }
    .feature-icon { font-size: 1.5rem; }

    .social-row { display: flex; gap: 10px; margin-bottom: 4px; }
    .btn-social {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 8px; border-radius: 10px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--color-border);
      background: var(--color-surface-raised); color: var(--color-text-primary);
      transition: all 0.15s; font-family: inherit;
    }
    .btn-social:hover { border-color: var(--color-accent); box-shadow: var(--shadow-glow-cyan); }
  </style>
</head>
<body>
  <div class="bg-staff" aria-hidden="true"></div>
  <div class="bg-notes" aria-hidden="true">
    <span>🎵</span><span>🎶</span><span>🎵</span><span>🎶</span>
    <span>🎵</span><span>🎶</span><span>🎵</span><span>🎶</span>
    <span>🎵</span><span>🎶</span><span>🎵</span><span>🎶</span>
    <span>🎵</span><span>🎶</span><span>🎵</span><span>🎶</span>
  </div>
  <div class="bg-clef" aria-hidden="true">𝄞</div>

  <div class="card">
    <div class="logo" aria-hidden="true">🎵</div>
    <h1 class="brand">Jamtrack Radio</h1>
    <p class="tagline">Your personal music library,<br>hosted your way.</p>

    <a class="btn btn-primary" href="03-login.html">Sign In</a>
    <a class="btn btn-secondary" href="02-register.html">Create Account</a>

    <div class="divider">or continue with</div>
    <div class="social-row">
      <button class="btn-social" onclick="window.location.href='04-library.html'" title="Continue with Google">
        <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.717v2.258h2.908C16.658 14.253 17.64 11.945 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Google
      </button>
      <button class="btn-social" onclick="window.location.href='04-library.html'" title="Continue with Apple">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Apple
      </button>
      <button class="btn-social" onclick="window.location.href='04-library.html'" title="Continue with Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </button>
    </div>

    <div class="divider">your private studio</div>

    <div class="feature-list">
      <div class="feature"><span class="feature-icon">🎸</span>Your tracks</div>
      <div class="feature"><span class="feature-icon">🔒</span>Self-hosted</div>
      <div class="feature"><span class="feature-icon">📋</span>Playlists</div>
      <div class="feature"><span class="feature-icon">🎛️</span>BPM &amp; Key</div>
    </div>
  </div>
</body>
</html>
