<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamtrack Radio — Playlist Detail</title>
  <style>
    :root {
      --color-bg:#071b1b; --color-surface:#0f2626; --color-surface-raised:#163333;
      --color-border:#1e4040; --color-border-focus:#00e5c8;
      --color-accent:#00e5c8; --color-accent-hover:#33eedb; --color-accent-subtle:#0a2d2a;
      --color-accent-2:#ff2d9b;
      --color-text-primary:#e8f8f8; --color-text-secondary:#7ec8c8; --color-text-muted:#3d7070;
      --color-error:#ff5577; --color-success:#00e577;
      --shadow-focus:0 0 0 3px rgba(0,229,200,0.4); --shadow-glow-cyan:0 0 16px rgba(0,229,200,0.25);
      --shadow-glow-rose:0 0 16px rgba(255,45,155,0.25);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .topnav { display:flex; align-items:center; gap:16px; padding:0 24px; height:58px; flex-shrink:0; background:var(--color-surface); border-bottom:1px solid var(--color-border); background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 17px,rgba(0,229,200,0.05) 17px,rgba(0,229,200,0.05) 18px); }
    .topnav__brand { font-size:1.1rem; font-weight:800; color:var(--color-accent); text-shadow:0 0 12px rgba(0,229,200,0.35); text-decoration:none; }
    .breadcrumb { display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--color-text-muted); }
    .breadcrumb a { color:var(--color-text-secondary); text-decoration:none; }
    .breadcrumb a:hover { color:var(--color-accent); }
    .avatar { width:32px; height:32px; border-radius:50%; background:var(--color-accent-subtle); border:1px solid var(--color-accent); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:var(--color-accent); margin-left:auto; text-decoration:none; cursor:pointer; }
    .avatar:hover { box-shadow:var(--shadow-glow-cyan); }

    .layout { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:210px; flex-shrink:0; background:var(--color-surface); border-right:1px solid var(--color-border); padding:16px 8px; display:flex; flex-direction:column; }
    .sidebar__item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:var(--color-text-secondary); text-decoration:none; font-size:0.88rem; font-weight:500; border-left:2px solid transparent; transition:all 0.1s; }
    .sidebar__item:hover { background:var(--color-surface-raised); color:var(--color-text-primary); }
    .sidebar__item.active { background:var(--color-accent-subtle); color:var(--color-accent); font-weight:600; border-left-color:var(--color-accent); }
    .sidebar__divider { height:1px; background:var(--color-border); margin:12px 8px; }
    .sidebar__label { font-size:0.7rem; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:0.08em; padding:4px 12px; margin-bottom:4px; }

    .main { flex:1; overflow-y:auto; padding:28px 32px; padding-bottom:90px; }

    /* Playlist hero */
    .playlist-hero {
      display:flex; gap:24px; align-items:flex-start; margin-bottom:28px;
      background:linear-gradient(135deg,#071b1b,#0f2e2e,#071b1b);
      border:1px solid var(--color-border); border-radius:14px; padding:24px;
      background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 14px,rgba(0,229,200,0.04) 14px,rgba(0,229,200,0.04) 15px);
      position:relative; overflow:hidden;
    }
    .playlist-hero::after { content:'𝄞'; position:absolute; right:20px; top:50%; transform:translateY(-50%); font-size:6rem; color:rgba(0,229,200,0.04); pointer-events:none; }
    .hero-art { width:100px; height:100px; border-radius:12px; background:var(--color-surface-raised); border:1px solid var(--color-border); display:flex; align-items:center; justify-content:center; font-size:3rem; flex-shrink:0; }
    .hero-info { flex:1; }
    .hero-title { font-size:1.5rem; font-weight:800; margin-bottom:6px; }
    .hero-desc { font-size:0.9rem; color:var(--color-text-secondary); margin-bottom:14px; }
    .hero-meta { font-size:0.82rem; color:var(--color-text-muted); }
    .hero-actions { display:flex; gap:10px; margin-top:16px; }

    .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:8px; font-size:0.88rem; font-weight:700; cursor:pointer; border:none; text-decoration:none; transition:all 0.15s; font-family:inherit; }
    .btn-primary { background:var(--color-accent); color:#071b1b; }
    .btn-primary:hover { background:var(--color-accent-hover); box-shadow:var(--shadow-glow-cyan); }
    .btn-rose { background:var(--color-accent-2); color:#fff; }
    .btn-rose:hover { background:#ff5cb4; box-shadow:var(--shadow-glow-rose); }
    .btn-ghost { background:transparent; color:var(--color-text-secondary); border:1px solid var(--color-border); }
    .btn-ghost:hover { color:var(--color-text-primary); }
    .btn-danger-ghost { background:transparent; color:var(--color-error); border:1px solid var(--color-error); }
    .btn-danger-ghost:hover { background:rgba(255,85,119,0.1); }
    .btn-sm { padding:7px 14px; font-size:0.8rem; }

    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:0.85rem; font-weight:700; color:var(--color-text-secondary); text-transform:uppercase; letter-spacing:0.06em; }

    /* Track list */
    .track-list { display:flex; flex-direction:column; gap:4px; }
    .track-row {
      display:flex; align-items:center; gap:12px; padding:10px 12px;
      border-radius:10px; background:var(--color-surface); border:1px solid transparent;
      transition:all 0.1s; cursor:pointer;
    }
    .track-row:hover { background:var(--color-surface-raised); border-color:var(--color-border); }
    .track-row.playing { background:var(--color-accent-subtle); border-color:var(--color-accent); box-shadow:var(--shadow-glow-cyan); }
    .track-row.playing .track-title { color:var(--color-accent); }
    .track-row.dragging { opacity:0.5; }
    .track-row.drag-over { border-color:var(--color-accent-2); background:var(--color-accent-2-subtle); }

    .track-num { width:24px; text-align:right; font-size:0.8rem; color:var(--color-text-muted); font-family:monospace; flex-shrink:0; }
    .drag-handle { color:var(--color-text-muted); cursor:grab; font-size:0.9rem; flex-shrink:0; padding:0 2px; }
    .drag-handle:active { cursor:grabbing; }
    .track-art { width:40px; height:40px; border-radius:6px; background:var(--color-surface-raised); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
    .track-info { flex:1; min-width:0; }
    .track-title { font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .track-artist { font-size:0.78rem; color:var(--color-text-secondary); }
    .track-meta { display:flex; gap:6px; flex-shrink:0; }
    .badge { display:inline-flex; align-items:center; padding:2px 7px; border-radius:4px; font-size:0.72rem; font-weight:600; }
    .badge-bpm   { background:rgba(0,229,200,0.15);  color:#00e5c8; border:1px solid rgba(0,229,200,0.35); }
    .badge-key   { background:rgba(255,45,155,0.15); color:#ff5cb4; border:1px solid rgba(255,45,155,0.35); }
    .track-dur { font-size:0.78rem; color:var(--color-text-muted); font-family:monospace; min-width:32px; text-align:right; }
    .track-actions { display:flex; gap:2px; }
    .btn-icon { background:none; border:none; color:var(--color-text-muted); cursor:pointer; padding:5px; border-radius:6px; font-size:0.95rem; min-width:34px; min-height:34px; display:flex; align-items:center; justify-content:center; transition:all 0.1s; }
    .btn-icon:hover { color:var(--color-text-primary); background:var(--color-surface-raised); }
    .btn-icon.remove:hover { color:var(--color-error); }
    .btn-icon.playing { color:var(--color-accent); }

    /* Reorder buttons */
    .reorder-btns { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
    .reorder-btn { background:none; border:none; color:var(--color-text-muted); cursor:pointer; padding:2px 4px; font-size:0.7rem; line-height:1; min-width:20px; min-height:20px; }
    .reorder-btn:hover { color:var(--color-accent); }
    .reorder-btn:disabled { opacity:0.2; cursor:not-allowed; }

    /* Player bar */
    .player { position:fixed; bottom:0; left:0; right:0; height:72px; display:flex; align-items:center; gap:20px; padding:0 24px; background:linear-gradient(135deg,#071b1b,#0f2e2e,#071b1b); border-top:1px solid var(--color-border); z-index:20; }
    .player.hidden { display:none; }
    .player__info { min-width:160px; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
    .player__title { font-size:0.85rem; font-weight:600; color:var(--color-accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 8px rgba(0,229,200,0.3); }
    .player__artist { font-size:0.75rem; color:var(--color-text-secondary); }
    .player__controls { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .play-btn { font-size:1.4rem; color:var(--color-accent); text-shadow:0 0 10px rgba(0,229,200,0.6); transition:color 0.15s,text-shadow 0.15s; }
    .play-btn:hover { color:var(--color-accent-2); text-shadow:var(--shadow-glow-rose); }
    .player__progress { flex:1; display:flex; align-items:center; gap:10px; }
    .player__time { font-size:0.72rem; color:var(--color-text-muted); font-family:monospace; min-width:30px; }
    .seek-bar { flex:1; height:4px; background:var(--color-surface-raised); border-radius:999px; overflow:hidden; cursor:pointer; }
    .seek-fill { height:100%; background:linear-gradient(90deg,var(--color-accent),var(--color-accent-2)); border-radius:999px; transition:width 0.5s linear; }
    .player__vol { display:flex; align-items:center; gap:8px; }
    .player__vol input { width:72px; accent-color:var(--color-accent); cursor:pointer; }

    .toast { position:fixed; bottom:84px; right:24px; z-index:50; display:flex; align-items:center; gap:10px; padding:12px 16px; background:#031a0d; border:1px solid #00a855; color:#6effa0; border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,0.6); font-size:0.88rem; opacity:0; transform:translateY(8px); transition:opacity 0.2s,transform 0.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="topnav__brand" href="04-library.html">🎵 Jamtrack Radio</a>
    <div class="breadcrumb">
      <a href="04-library.html">Library</a>
      <span>/</span>
      <a href="07-playlists.html">Playlists</a>
      <span>/</span>
      <span>Morning Practice</span>
    </div>
    <a class="avatar" href="09-account-settings.html" title="Account settings" aria-label="Account settings">KN</a>
  </nav>

  <div class="layout">
    <nav class="sidebar">
      <a class="sidebar__item" href="04-library.html">🎸 Library</a>
      <a class="sidebar__item active" href="07-playlists.html">📋 Playlists</a>
      <a class="sidebar__item" href="05-upload-track.html">⬆️ Upload</a>
      <div class="sidebar__divider"></div>
      <div class="sidebar__label">Settings</div>
      <a class="sidebar__item" href="09-account-settings.html">⚙️ Account</a>
      <div class="sidebar__divider"></div>
      <a class="sidebar__item" href="01-welcome.html">🚪 Sign out</a>
    </nav>

    <main class="main">
      <!-- Hero -->
      <div class="playlist-hero">
        <div class="hero-art" aria-hidden="true">🌅</div>
        <div class="hero-info">
          <h1 class="hero-title">Morning Practice</h1>
          <p class="hero-desc">Warm-up tracks to start the day</p>
          <p class="hero-meta" id="hero-meta">4 tracks · 18:23 total</p>
          <div class="hero-actions">
            <button class="btn btn-rose btn-sm" id="play-all-btn">▶ Play All</button>
            <button class="btn btn-ghost btn-sm" onclick="showToast('🔀 Shuffle started')">🔀 Shuffle</button>
            <a class="btn btn-ghost btn-sm" href="07-playlists.html">← Back</a>
          </div>
        </div>
      </div>

      <!-- Tracks -->
      <div class="section-header">
        <span class="section-title">Tracks</span>
        <span style="font-size:0.78rem;color:var(--color-text-muted)">Drag ↕ or use arrows to reorder</span>
      </div>
      <div class="track-list" id="track-list" role="list"></div>
    </main>
  </div>

  <!-- Player bar -->
  <div class="player hidden" id="player">
    <div class="player__info">
      <div class="player__title" id="player-title">—</div>
      <div class="player__artist" id="player-artist">—</div>
    </div>
    <div class="player__controls">
      <button class="btn-icon" id="prev-btn" aria-label="Previous">⏮</button>
      <button class="btn-icon play-btn" id="play-btn" aria-label="Play">▶</button>
      <button class="btn-icon" id="next-btn" aria-label="Next">⏭</button>
    </div>
    <div class="player__progress">
      <span class="player__time" id="time-cur">0:00</span>
      <div class="seek-bar">
        <div class="seek-fill" id="seek-fill" style="width:0%"></div>
      </div>
      <span class="player__time" id="time-tot">0:00</span>
    </div>
    <div class="player__vol">
      <span>🔊</span>
      <input type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let tracks = [
      { id:1, title:'Minor Blues in E',    artist:'Kumaran Naidoo',    bpm:120, key:'E minor',  dur:'3:42' },
      { id:2, title:'Blues Shuffle in A',  artist:'Kumaran Naidoo',    bpm:95,  key:'A major',  dur:'6:02' },
      { id:3, title:'Jazz Ballad in D♭',   artist:'Session Recording', bpm:72,  key:'D♭ major', dur:'4:28' },
      { id:4, title:'Funk Groove — No. 3', artist:'Session Recording', bpm:98,  key:'G major',  dur:'5:11' },
    ];

    let currentId  = null;
    let isPlaying  = false;
    let seekPos    = 0;
    let seekIv     = null;
    let dragSrcIdx = null;
    let toastTimer;

    function secToMmSs(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }
    function durToSec(d) { const [m,s]=d.split(':'); return parseInt(m)*60+parseInt(s); }

    function showToast(msg) {
      const t=document.getElementById('toast');
      t.textContent=msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
    }

    function updateHeroMeta() {
      const total = tracks.reduce((acc,t)=>acc+durToSec(t.dur),0);
      document.getElementById('hero-meta').textContent =
        tracks.length+' track'+(tracks.length!==1?'s':'')+' · '+secToMmSs(total)+' total';
    }

    function renderTracks() {
      const list = document.getElementById('track-list');
      list.innerHTML = tracks.map((t,i) => `
        <div class="track-row ${currentId===t.id?'playing':''}" role="listitem"
             draggable="true" data-idx="${i}"
             ondragstart="dragStart(event,${i})"
             ondragover="dragOver(event,${i})"
             ondrop="dragDrop(event,${i})"
             ondragleave="dragLeave(event)"
             ondragend="dragEnd(event)"
             onclick="selectTrack(${t.id})">
          <span class="track-num">${i+1}</span>
          <span class="drag-handle" aria-hidden="true">⋮⋮</span>
          <div class="track-art" aria-hidden="true">🖼️</div>
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist}</div>
          </div>
          <div class="track-meta">
            <span class="badge badge-bpm">${t.bpm} BPM</span>
            <span class="badge badge-key">${t.key}</span>
          </div>
          <span class="track-dur">${t.dur}</span>
          <div class="reorder-btns">
            <button class="reorder-btn" aria-label="Move up" onclick="event.stopPropagation();moveUp(${i})" ${i===0?'disabled':''}>▲</button>
            <button class="reorder-btn" aria-label="Move down" onclick="event.stopPropagation();moveDown(${i})" ${i===tracks.length-1?'disabled':''}>▼</button>
          </div>
          <div class="track-actions" onclick="event.stopPropagation()">
            <button class="btn-icon ${currentId===t.id&&isPlaying?'playing':''}"
              aria-label="${currentId===t.id&&isPlaying?'Pause':'Play'}"
              onclick="togglePlay(${t.id})">
              ${currentId===t.id&&isPlaying?'⏸':'▶'}
            </button>
            <button class="btn-icon remove" aria-label="Remove from playlist"
              onclick="removeTrack(${t.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // ── Reorder (arrow buttons) ──
    function moveUp(i) {
      if (i<=0) return;
      [tracks[i-1],tracks[i]]=[tracks[i],tracks[i-1]];
      renderTracks(); updateHeroMeta();
    }
    function moveDown(i) {
      if (i>=tracks.length-1) return;
      [tracks[i+1],tracks[i]]=[tracks[i],tracks[i+1]];
      renderTracks(); updateHeroMeta();
    }

    // ── Drag & drop reorder ──
    function dragStart(e, i) { dragSrcIdx=i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
    function dragOver(e, i) { e.preventDefault(); e.dataTransfer.dropEffect='move'; if (i!==dragSrcIdx) e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function dragDrop(e, i) {
      e.preventDefault();
      if (dragSrcIdx===null || dragSrcIdx===i) return;
      const moved = tracks.splice(dragSrcIdx,1)[0];
      tracks.splice(i,0,moved);
      renderTracks(); updateHeroMeta();
      showToast('Track reordered');
    }
    function dragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); dragSrcIdx=null; }

    // ── Remove ──
    function removeTrack(id) {
      const t=tracks.find(x=>x.id===id);
      tracks=tracks.filter(x=>x.id!==id);
      if (currentId===id) { stopPlay(); currentId=null; document.getElementById('player').classList.add('hidden'); }
      renderTracks(); updateHeroMeta();
      showToast('🗑️ "'+t.title+'" removed from playlist');
    }

    // ── Playback ──
    function selectTrack(id) {
      const t=tracks.find(x=>x.id===id);
      if (!t) return;
      if (currentId===id) { togglePlayState(); return; }
      stopPlay();
      currentId=id; isPlaying=true; seekPos=0;
      updatePlayerUI(t); startSeek(t); renderTracks();
    }
    function togglePlay(id) {
      if (currentId!==id) { selectTrack(id); return; }
      togglePlayState();
    }
    function togglePlayState() {
      isPlaying=!isPlaying;
      const t=tracks.find(x=>x.id===currentId);
      if (isPlaying) startSeek(t); else stopPlay();
      updatePlayerUI(t); renderTracks();
    }
    function stopPlay() { clearInterval(seekIv); }
    function updatePlayerUI(t) {
      const player=document.getElementById('player');
      player.classList.toggle('hidden',!t);
      if (!t) return;
      document.getElementById('player-title').textContent =t.title;
      document.getElementById('player-artist').textContent=t.artist;
      document.getElementById('time-tot').textContent=t.dur;
      document.getElementById('play-btn').textContent=isPlaying?'⏸':'▶';
    }
    function startSeek(t) {
      stopPlay();
      const total=durToSec(t.dur);
      seekIv=setInterval(()=>{
        if (!isPlaying) return;
        seekPos=Math.min(seekPos+1,total);
        document.getElementById('seek-fill').style.width=(seekPos/total*100)+'%';
        document.getElementById('time-cur').textContent=secToMmSs(seekPos);
        if (seekPos>=total) { stopPlay(); nextTrack(); }
      },1000);
    }
    function nextTrack() {
      const i=tracks.findIndex(t=>t.id===currentId);
      if (i<tracks.length-1) selectTrack(tracks[i+1].id);
      else { stopPlay(); isPlaying=false; seekPos=0; updatePlayerUI(tracks[i]); renderTracks(); }
    }

    document.getElementById('play-btn').addEventListener('click',()=>{ if(currentId) togglePlayState(); });
    document.getElementById('next-btn').addEventListener('click',()=>{ if(currentId) nextTrack(); });
    document.getElementById('prev-btn').addEventListener('click',()=>{
      const i=tracks.findIndex(t=>t.id===currentId);
      if(i>0) selectTrack(tracks[i-1].id); else { seekPos=0; document.getElementById('seek-fill').style.width='0%'; document.getElementById('time-cur').textContent='0:00'; }
    });

    // Play all
    document.getElementById('play-all-btn').addEventListener('click',()=>{ if(tracks.length) selectTrack(tracks[0].id); });

    renderTracks();
    updateHeroMeta();
  </script>
</body>
</html>
